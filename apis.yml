aid: dayi35-com
name: 大易有塑 (dayi35.com)
description: 'dayi35.com (大易有塑, Dayi Yousu) is a Chinese business-to-business e-commerce
  and trading platform for plastics and chemical raw materials, operated out of Dongguan,
  Guangdong. The platform runs an online mall covering general-purpose plastics (ABS,
  EVA, GPPS, HIPS, LLDPE), engineering plastics (PA6, PA66, PBT, PC, PET, PMMA, PPS,
  LCP), modified and recycled resins, and chemical additives such as titanium dioxide,
  carbon black, flame retardants and release agents. Alongside the mall it operates
  a buyer request-for-quote board (求购), a daily domestic and international price and
  market-data service, industry news, and supply-chain services spanning warehousing,
  logistics distribution, and e-commerce enablement for plastics and chemicals enterprises.
  Buyer and seller activity runs through an authenticated member console at /uc. The
  site is filed under Chinese ICP licence 粤ICP备15037802号.'
